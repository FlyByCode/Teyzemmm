<!DOCTYPE html>
<html lang="tr">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
 <title>Rüviş'e Özel</title>
 <style>
 *, *::after, *::before { padding: 0; margin: 0; box-sizing: border-box; }
 :root { --dark-color: #000; }

 body {
 display: flex;
 align-items: flex-end;
 justify-content: center;
 min-height: 100vh;
 background-color: var(--dark-color);
 overflow: hidden;
 perspective: 1000px;
 font-family: 'Segoe UI', Arial, sans-serif;
 }

 /* ── Gece arka planı ── */
 .night {
 position: fixed; left: 50%; top: 0;
 transform: translateX(-50%);
 width: 100%; height: 100%;
 filter: blur(0.1vmin);
 background-image:
 radial-gradient(ellipse at top, transparent 0%, var(--dark-color)),
 radial-gradient(ellipse at bottom, var(--dark-color), rgba(145,233,255,0.2)),
 repeating-linear-gradient(220deg,black 0px,black 19px,transparent 19px,transparent 22px),
 repeating-linear-gradient(189deg,black 0px,black 19px,transparent 19px,transparent 22px),
 repeating-linear-gradient(148deg,black 0px,black 19px,transparent 19px,transparent 22px),
 linear-gradient(90deg,#00fffa,#f0f0f0);
 }

 /* ══════════════════════════════════════════
 SLAYT EKRANI
 ══════════════════════════════════════════ */
 #slayt-ekrani {
 position: fixed;
 inset: 0;
 z-index: 9999;
 background: #000;
 display: flex;
 align-items: center;
 justify-content: center;
 transition: opacity 1.2s ease;
 }

 #slayt-ekrani.kapat {
 opacity: 0;
 pointer-events: none;
 }

 /* Tek slayt */
 .slayt {
 position: absolute;
 inset: 0;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: flex-end;
 opacity: 0;
 transition: opacity 0.8s ease;
 overflow: hidden;
 }

 .slayt.aktif { opacity: 1; }

 /* Tam ekran fotoğraf arka plan */
 .slayt__foto-wrap {
 position: absolute;
 inset: 0;
 width: 100%;
 height: 100%;
 opacity: 0;
 transform: scale(1.05);
 transition: opacity 1s ease 0.2s, transform 6s ease 0.2s;
 z-index: 0;
 }

 .slayt.aktif .slayt__foto-wrap {
 opacity: 1;
 transform: scale(1);
 }

 .slayt__foto-wrap img {
 width: 100%;
 height: 100%;
 object-fit: cover;
 object-position: center top;
 display: block;
 }

 /* Karartma overlay */
 .slayt__foto-wrap::after {
 content: "";
 position: absolute;
 inset: 0;
 background: linear-gradient(
 to bottom,
 rgba(0,0,0,0.15) 0%,
 rgba(0,0,0,0.05) 40%,
 rgba(0,0,0,0.55) 70%,
 rgba(0,0,0,0.85) 100%
 );
 }

 /* Placeholder (fotoğraf yokken) */
 .slayt__foto-placeholder {
 width: 100%;
 height: 100%;
 background: linear-gradient(135deg, #0a2a30 0%, #0d1f26 100%);
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 color: #2a5a6a;
 font-size: 16px;
 gap: 12px;
 text-align: center;
 padding: 20px;
 }

 .slayt__foto-placeholder .icon { font-size: 56px; filter: grayscale(1) opacity(0.3); }

 /* Yazı kısmı — fotoğrafın üzerinde, altta */
 .slayt__metin {
 position: relative;
 z-index: 1;
 display: flex;
 flex-direction: column;
 align-items: center;
 gap: 10px;
 padding: 24px 24px 80px;
 width: 100%;
 text-align: center;
 }

 .slayt__etiket {
 font-size: clamp(11px, 3.5vw, 15px);
 color: #39c6d6;
 letter-spacing: 5px;
 text-transform: uppercase;
 opacity: 0;
 transform: translateY(16px);
 transition: opacity 0.7s ease 0.6s, transform 0.7s ease 0.6s;
 text-shadow: 0 1px 8px rgba(0,0,0,0.8);
 }

 .slayt__baslik {
 font-size: clamp(32px, 10vw, 72px);
 font-weight: 900;
 color: #fff;
 text-align: center;
 line-height: 1.05;
 opacity: 0;
 transform: translateY(20px);
 transition: opacity 0.7s ease 0.85s, transform 0.7s ease 0.85s;
 text-shadow: 0 2px 20px rgba(0,0,0,0.9), 0 0 40px rgba(44,228,245,0.3);
 }

 .slayt__baslik span { color: #2ce4f5; }

 /* Aktif slaytın yazıları görünür */
 .slayt.aktif .slayt__etiket,
 .slayt.aktif .slayt__baslik { opacity: 1; transform: translateY(0); }

 /* İlerleme noktaları */
 #ilerleme {
 position: fixed;
 bottom: 28px;
 left: 50%;
 transform: translateX(-50%);
 display: flex;
 gap: 10px;
 z-index: 10000;
 }

 .nokta {
 width: 8px;
 height: 8px;
 border-radius: 50%;
 background: #2a4a55;
 transition: background 0.4s, transform 0.4s;
 }

 .nokta.aktif {
 background: #2ce4f5;
 transform: scale(1.3);
 }

 /* Son slayt — doğum günü */
 .slayt--son .slayt__baslik {
 font-size: clamp(26px, 7.5vw, 56px);
 color: #65e6cc;
 }

 /* Mobil — intro slaytlar */
 @media (max-width: 768px) {
 #slayt-ekrani { cursor: pointer; }
 .slayt__foto-wrap img { object-position: center center; }
 .slayt__metin {
 padding: 16px 20px calc(88px + env(safe-area-inset-bottom, 0));
 gap: 6px;
 }
 .slayt__baslik { font-size: clamp(26px, 8.5vw, 40px); }
 .slayt__etiket { font-size: 11px; letter-spacing: 3px; }
 #ilerleme { bottom: calc(24px + env(safe-area-inset-bottom, 0)); }
 #slayt-atla {
 display: block;
 position: fixed;
 top: calc(12px + env(safe-area-inset-top, 0));
 right: 12px;
 z-index: 10001;
 padding: 8px 14px;
 font-size: 12px;
 color: #5a8a95;
 background: rgba(0,0,0,0.5);
 border: 1px solid #2a4a55;
 border-radius: 20px;
 }
 }
 #slayt-atla { display: none; }

 /* ══════════════════════════════════════════
 LEONARDO TARZI YOLCULUK — sürükle + mouse parallax
 ══════════════════════════════════════════ */
 #yolculuk-ekrani {
 position: fixed;
 inset: 0;
 z-index: 8000;
 background: #030809;
 opacity: 0;
 pointer-events: none;
 transition: opacity 1s ease;
 overflow: hidden;
 touch-action: none;
 user-select: none;
 cursor: grab;
 }

 #yolculuk-ekrani.aktif { opacity: 1; pointer-events: auto; }
 #yolculuk-ekrani.surukleniyor { cursor: grabbing; }

 #yolculuk-bg {
 position: absolute;
 inset: 0;
 z-index: 0;
 pointer-events: none;
 background:
 radial-gradient(ellipse 80% 60% at 50% 45%, rgba(44,228,245,0.06) 0%, transparent 55%),
 linear-gradient(105deg, transparent 40%, rgba(57,198,214,0.03) 50%, transparent 60%);
 animation: leo-bg-kayma 18s ease-in-out infinite alternate;
 }

 @keyframes leo-bg-kayma {
 0% { transform: translateX(-2%) scale(1.02); }
 100% { transform: translateX(2%) scale(1.02); }
 }

 #yolculuk-vignette {
 position: absolute;
 inset: 0;
 z-index: 5;
 pointer-events: none;
 background:
 radial-gradient(ellipse 70% 55% at 50% 48%, transparent 0%, rgba(3,8,9,0.25) 50%, rgba(3,8,9,0.75) 100%),
 linear-gradient(90deg, rgba(3,8,9,0.6) 0%, transparent 12%, transparent 88%, rgba(3,8,9,0.6) 100%);
 }

 #yolculuk-iz {
 position: absolute;
 inset: 0;
 perspective: 1600px;
 transform-style: preserve-3d;
 z-index: 1;
 }

 /* ── FIX 1: Masaüstü ve mobil için ortak foto boyutları ── */
 .yol-foto {
 --foto-w: clamp(160px, 28vw, 300px);
 position: absolute;
 left: 50%;
 top: 52%;
 width: var(--foto-w);
 aspect-ratio: 4/5;
 margin-left: calc(var(--foto-w) / -2);
 margin-top: calc(var(--foto-w) * 5 / -10);
 border-radius: 18px;
 overflow: hidden;
 box-shadow: 0 32px 80px rgba(0,0,0,0.75), 0 0 0 1px rgba(255,255,255,0.08);
 will-change: transform, opacity;
 pointer-events: none;
 backface-visibility: hidden;
 transition: box-shadow 0.35s ease;
 }

 .yol-foto--hero {
 --foto-w: clamp(200px, 44vw, 440px);
 z-index: 50;
 border-radius: 20px;
 }

 .yol-foto.onde {
 box-shadow: 0 48px 110px rgba(44,228,245,0.3), 0 0 0 2px rgba(44,228,245,0.25);
 }

 .yol-foto img {
 width: 100%;
 height: 100%;
 object-fit: cover;
 display: block;
 }

 .yol-foto__ph {
 width: 100%;
 height: 100%;
 background: linear-gradient(135deg, #0a2a30, #0d1f26);
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 color: #2a5a6a;
 font-size: 11px;
 gap: 6px;
 }

 .yol-foto__ph span { font-size: 24px; opacity: 0.35; }

 #merkez-baslik {
 position: fixed;
 left: 50%;
 top: 42%;
 transform: translate(-50%, -50%);
 z-index: 8100;
 text-align: center;
 pointer-events: none;
 width: 92%;
 max-width: 520px;
 }

 #merkez-baslik .mb-etiket {
 font-size: clamp(11px, 3.2vw, 15px);
 color: #39c6d6;
 letter-spacing: 6px;
 text-transform: uppercase;
 margin-bottom: 10px;
 text-shadow: 0 0 24px rgba(57,198,214,0.5);
 transition: opacity 0.35s ease;
 }

 #merkez-baslik .mb-baslik {
 font-size: clamp(36px, 11vw, 80px);
 font-weight: 900;
 color: #fff;
 line-height: 1.05;
 text-shadow: 0 4px 40px rgba(0,0,0,0.95), 0 0 50px rgba(44,228,245,0.35);
 transition: opacity 0.35s ease, transform 0.35s ease;
 }

 #merkez-baslik .mb-baslik span { color: #2ce4f5; }
 #merkez-baslik.soluk .mb-etiket,
 #merkez-baslik.soluk .mb-baslik { opacity: 0.15; }

 #yolculuk-bar-wrap {
 position: fixed;
 top: 0;
 left: 0;
 right: 0;
 height: 3px;
 z-index: 8250;
 background: rgba(255,255,255,0.06);
 pointer-events: none;
 padding-top: env(safe-area-inset-top, 0);
 }

 #yolculuk-bar-dolgu {
 height: 100%;
 width: 0%;
 background: linear-gradient(90deg, #14757a, #2ce4f5);
 transition: width 0.15s ease-out;
 box-shadow: 0 0 12px rgba(44,228,245,0.6);
 }

 #yolculuk-ilerleme {
 position: fixed;
 bottom: calc(56px + env(safe-area-inset-bottom, 0));
 left: 50%;
 transform: translateX(-50%);
 display: flex;
 gap: 10px;
 z-index: 8200;
 }

 .yol-nokta {
 width: 8px;
 height: 8px;
 border-radius: 50%;
 background: #2a4a55;
 transition: background 0.35s, transform 0.35s;
 }

 .yol-nokta.aktif { background: #2ce4f5; transform: scale(1.35); }

 #yolculuk-ipucu {
 position: fixed;
 bottom: calc(22px + env(safe-area-inset-bottom, 0));
 left: 50%;
 transform: translateX(-50%);
 z-index: 8200;
 font-size: clamp(11px, 3vw, 14px);
 color: #5a8a95;
 text-align: center;
 max-width: 92vw;
 padding: 0 12px;
 line-height: 1.4;
 opacity: 0;
 transition: opacity 0.8s ease 0.5s;
 pointer-events: none;
 }

 .yol-btn {
 display: none;
 position: fixed;
 top: 50%;
 transform: translateY(-50%);
 z-index: 8200;
 width: 48px;
 height: 48px;
 border: 1px solid rgba(44,228,245,0.35);
 background: rgba(10,30,35,0.85);
 color: #2ce4f5;
 font-size: 22px;
 border-radius: 50%;
 cursor: pointer;
 -webkit-tap-highlight-color: transparent;
 backdrop-filter: blur(8px);
 }

 #yol-geri { left: max(12px, env(safe-area-inset-left, 12px)); }
 #yol-ileri { right: max(12px, env(safe-area-inset-right, 12px)); }

 #yolculuk-ekrani.aktif #yolculuk-ipucu { opacity: 1; }

 #yol-ok {
 position: fixed;
 right: 18px;
 top: 50%;
 transform: translateY(-50%);
 z-index: 8200;
 font-size: 28px;
 color: #2ce4f5;
 opacity: 0;
 animation: yol-ok-nefes 1.4s ease-in-out infinite;
 pointer-events: none;
 }

 #yolculuk-ekrani.aktif #yol-ok { opacity: 0.7; }

 @keyframes yol-ok-nefes {
 0%, 100% { transform: translateY(-50%) translateX(0); opacity: 0.4; }
 50% { transform: translateY(-50%) translateX(8px); opacity: 0.9; }
 }

 #yolculuk-finale {
 position: fixed;
 inset: 0;
 z-index: 8300;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 background: rgba(0,0,0,0.88);
 opacity: 0;
 pointer-events: none;
 transition: opacity 1s ease;
 text-align: center;
 gap: 12px;
 }

 #yolculuk-finale.gorunur { opacity: 1; pointer-events: auto; }

 #yolculuk-finale .finale-etiket {
 font-size: 14px;
 color: #39c6d6;
 letter-spacing: 5px;
 text-transform: uppercase;
 }

 #yolculuk-finale .finale-isim {
 font-size: clamp(40px, 12vw, 90px);
 font-weight: 900;
 color: #65e6cc;
 text-shadow: 0 0 40px rgba(101,230,204,0.4);
 }

 /* ── FIX 2: Mobilde yan fotoğraflar artık görünür,
    küçük boyutla 3'lü fan düzeni ── */
 @media (max-width: 768px) {
 body.mobil-mod { overflow: hidden; }

 #yolculuk-bg { animation: none; }
 #yolculuk-vignette {
 background: linear-gradient(to bottom,
 rgba(3,8,9,0.5) 0%, transparent 22%,
 transparent 72%, rgba(3,8,9,0.92) 100%);
 }

 /* Mobil başlık - üst şerit */
 #merkez-baslik {
 top: 0;
 left: 0;
 right: 0;
 width: 100%;
 max-width: none;
 transform: none;
 padding: calc(14px + env(safe-area-inset-top, 0)) 16px 12px;
 background: linear-gradient(to bottom, rgba(3,8,9,0.95), rgba(3,8,9,0.7) 80%, transparent);
 }
 #merkez-baslik .mb-etiket {
 font-size: 10px;
 letter-spacing: 4px;
 margin-bottom: 4px;
 }
 #merkez-baslik .mb-baslik {
 font-size: clamp(22px, 7vw, 32px);
 }
 /* Mobilde de sürükleme sırasında soldur */
 #merkez-baslik.soluk .mb-etiket,
 #merkez-baslik.soluk .mb-baslik { opacity: 0.15; }

 /* Mobil foto boyutları: 3 fotoğraf yan yana sığsın */
 .yol-foto        { --foto-w: clamp(100px, 24vw, 190px); border-radius: 12px; }
 .yol-foto--hero  { --foto-w: clamp(150px, 38vw, 300px); border-radius: 14px; }

 /* YAN FOTOĞRAFLARI GİZLEME — artık göster */

 #yol-geri, #yol-ileri, #yol-ok { display: none !important; }

 #yolculuk-ilerleme {
 bottom: calc(78px + env(safe-area-inset-bottom, 0));
 gap: 8px;
 }
 .yol-nokta { width: 10px; height: 10px; }

 #yolculuk-ipucu {
 bottom: calc(132px + env(safe-area-inset-bottom, 0));
 font-size: 12px;
 white-space: normal;
 }

 #yol-mobil-nav {
 display: flex;
 align-items: center;
 justify-content: space-between;
 gap: 10px;
 position: fixed;
 left: 12px;
 right: 12px;
 bottom: calc(12px + env(safe-area-inset-bottom, 0));
 z-index: 8300;
 padding: 10px 12px;
 background: rgba(8,24,28,0.92);
 border: 1px solid rgba(44,228,245,0.25);
 border-radius: 16px;
 backdrop-filter: blur(12px);
 }

 #yol-mobil-nav button {
 flex: 1;
 min-height: 48px;
 border: none;
 border-radius: 12px;
 font-size: 15px;
 font-weight: 700;
 font-family: inherit;
 cursor: pointer;
 -webkit-tap-highlight-color: transparent;
 }
 #yol-mbtn-geri {
 background: rgba(255,255,255,0.08);
 color: #b8dce4;
 }
 #yol-mbtn-ileri {
 background: linear-gradient(135deg, #14757a, #2ce4f5);
 color: #041014;
 }
 #yol-mbtn-adim {
 flex: 0 0 auto;
 min-width: 52px;
 text-align: center;
 font-size: 13px;
 color: #5a8a95;
 font-weight: 600;
 }

 .flowers { transform: scale(0.5); transform-origin: bottom center; }
 #ust-banner { padding-top: calc(12px + env(safe-area-inset-top, 0)); }
 }

 #yol-mobil-nav { display: none; }

 @media (max-width: 480px) {
 .yol-foto { border-radius: 10px; }
 .yol-foto--hero { border-radius: 12px; }
 }

 /* ══════════════════════════════════════════
 ÜST BANNER (çiçeklerle birlikte)
 ══════════════════════════════════════════ */
 #ust-banner {
 position: fixed;
 top: 0; left: 0; right: 0;
 z-index: 500;
 text-align: center;
 padding: 16px 20px 12px;
 background: linear-gradient(to bottom, rgba(0,0,0,0.9) 60%, transparent);
 opacity: 0;
 transform: translateY(-10px);
 transition: opacity 1.2s ease, transform 1.2s ease;
 pointer-events: none;
 }

 #ust-banner.gorunu { opacity: 1; transform: translateY(0); }

 .banner-isim {
 font-size: clamp(20px, 5vw, 34px);
 font-weight: 800;
 color: #2ce4f5;
 text-shadow: 0 0 20px rgba(44,228,245,0.6);
 letter-spacing: 1px;
 }

 .banner-alt {
 font-size: clamp(12px, 2.5vw, 16px);
 color: #65e6cc;
 margin-top: 4px;
 letter-spacing: 2px;
 }

 /* ══════════════════════════════════════════
 ÇİÇEK ANİMASYONU (orijinal)
 ══════════════════════════════════════════ */
 .flowers { position: relative; transform: scale(0.7); }
 .flower { position:absolute; bottom:10vmin; transform-origin:bottom center; z-index:10; --fl-speed:0.8s; }
 .flower--1 { animation:moving-flower-1 4s linear infinite; }
 .flower--1 .flower__line { height:70vmin; animation-delay:0.3s; }
 .flower--1 .flower__line__leaf--1 { animation:blooming-leaf-right var(--fl-speed) 1.6s backwards; }
 .flower--1 .flower__line__leaf--2 { animation:blooming-leaf-right var(--fl-speed) 1.4s backwards; }
 .flower--1 .flower__line__leaf--3 { animation:blooming-leaf-left var(--fl-speed) 1.2s backwards; }
 .flower--1 .flower__line__leaf--4 { animation:blooming-leaf-left var(--fl-speed) 1s backwards; }
 .flower--1 .flower__line__leaf--5 { animation:blooming-leaf-right var(--fl-speed) 1.8s backwards; }
 .flower--1 .flower__line__leaf--6 { animation:blooming-leaf-left var(--fl-speed) 2s backwards; }
 .flower--2 { left:50%; transform:rotate(30deg); animation:moving-flower-2 4s linear infinite; }
 .flower--2 .flower__line { height:60vmin; animation-delay:0.8s; }
 .flower--2 .flower__line__leaf--1 { animation:blooming-leaf-right var(--fl-speed) 1.9s backwards; }
 .flower--2 .flower__line__leaf--2 { animation:blooming-leaf-right var(--fl-speed) 1.7s backwards; }
 .flower--2 .flower__line__leaf--3 { animation:blooming-leaf-left var(--fl-speed) 1.5s backwards; }
 .flower--2 .flower__line__leaf--4 { animation:blooming-leaf-left var(--fl-speed) 1.3s backwards; }
 .flower--3 { left:50%; transform:rotate(-15deg); animation:moving-flower-3 4s linear infinite; }
 .flower--3 .flower__line { animation-delay:0.9s; }
 .flower--3 .flower__line__leaf--1 { animation:blooming-leaf-right var(--fl-speed) 2.5s backwards; }
 .flower--3 .flower__line__leaf--2 { animation:blooming-leaf-right var(--fl-speed) 2.3s backwards; }
 .flower--3 .flower__line__leaf--3 { animation:blooming-leaf-left var(--fl-speed) 2.1s backwards; }
 .flower--3 .flower__line__leaf--4 { animation:blooming-leaf-left var(--fl-speed) 1.9s backwards; }
 .flower__leafs { position:relative; animation:blooming-flower 2s backwards; }
 .flower__leafs--1 { animation-delay:1.1s; }
 .flower__leafs--2 { animation-delay:1.4s; }
 .flower__leafs--3 { animation-delay:1.7s; }
 .flower__leafs::after { content:""; position:absolute; left:0; top:0; transform:translate(-50%,-100%); width:8vmin; height:8vmin; background-color:#6bf0ff; filter:blur(10vmin); }
 .flower__leaf { position:absolute; bottom:0; left:50%; width:8vmin; height:11vmin; border-radius:51% 49% 47% 53%/44% 45% 55% 69%; background-color:#65e6cc; background-image:linear-gradient(to top,#40bbab,#a7ffee); transform-origin:bottom center; opacity:0.9; box-shadow:inset 0 0 2vmin rgba(255,255,255,0.5); }
 .flower__leaf--1 { transform:translate(-10%,1%) rotateY(40deg) rotateX(-50deg); }
 .flower__leaf--2 { transform:translate(-50%,-4%) rotateX(40deg); }
 .flower__leaf--3 { transform:translate(-90%,0%) rotateY(45deg) rotateX(50deg); }
 .flower__leaf--4 { width:8vmin; height:8vmin; transform-origin:bottom left; border-radius:4vmin 10vmin 4vmin 4vmin; transform:translate(0%,18%) rotateX(70deg) rotate(-43deg); background-image:linear-gradient(to top,#39c6d6,#a7ffee); z-index:1; opacity:0.8; }
 .flower__white-circle { position:absolute; left:-3.5vmin; top:-3vmin; width:9vmin; height:4vmin; border-radius:50%; background-color:#fff; }
 .flower__white-circle::after { content:""; position:absolute; left:50%; top:45%; transform:translate(-50%,-50%); width:60%; height:60%; border-radius:inherit; background-image:linear-gradient(90deg,#ffeb12,#ffce00); }
 .flower__line { height:55vmin; width:1.5vmin; background-image:linear-gradient(to left,rgba(0,0,0,0.2),transparent,rgba(255,255,255,0.2)),linear-gradient(to top,transparent 10%,#14757a,#39c6d6); box-shadow:inset 0 0 2px rgba(0,0,0,0.5); animation:grow-flower-tree 4s backwards; }
 .flower__line__leaf { --w:7vmin; --h:calc(var(--w)+2vmin); position:absolute; top:20%; left:90%; width:var(--w); height:var(--h); border-top-right-radius:var(--h); border-bottom-left-radius:var(--h); background-image:linear-gradient(to top,rgba(20,117,122,0.4),#39c6d6); }

 <div class="long-g long-g--4"><div class="grow-ans" style="--d:4s"><div class="leaf leaf--0"></div></div><div class="grow-ans" style="--d:4.2s"><div class="leaf leaf--1"></div></div><div class="grow-ans" style="--d:3s"><div class="leaf leaf--2"></div></div><div class="grow-ans" style="--d:3.6s"><div class="leaf leaf--3"></div></div></div>
 <div class="long-g long-g--5"><div class="grow-ans" style="--d:4s"><div class="leaf leaf--0"></div></div><div class="grow-ans" style="--d:4.2s"><div class="leaf leaf--1"></div></div><div class="grow-ans" style="--d:3s"><div class="leaf leaf--2"></div></div><div class="grow-ans" style="--d:3.6s"><div class="leaf leaf--3"></div></div></div>
 <div class="long-g long-g--6"><div class="grow-ans" style="--d:4.2s"><div class="leaf leaf--0"></div></div><div class="grow-ans" style="--d:4.4s"><div class="leaf leaf--1"></div></div><div class="grow-ans" style="--d:4.6s"><div class="leaf leaf--2"></div></div><div class="grow-ans" style="--d:4.8s"><div class="leaf leaf--3"></div></div></div>
 <div class="long-g long-g--7"><div class="grow-ans" style="--d:3s"><div class="leaf leaf--0"></div></div><div class="grow-ans" style="--d:3.2s"><div class="leaf leaf--1"></div></div><div class="grow-ans" style="--d:3.5s"><div class="leaf leaf--2"></div></div><div class="grow-ans" style="--d:3.6s"><div class="leaf leaf--3"></div></div></div>
 </div>

 <script>
 // ═══════════════════════════════════════
 // 16 FOTO — hiçbiri tekrarlanmaz
 // Intro: foto1-4 | Yolculuk: foto5-18
 // ═══════════════════════════════════════
 const BOLUMLER = [
 { etiket: 'Dünyanın', vurgu: 'Zeki', ek: 'si', fotolar: ['foto5.jpeg','foto6.jpeg','foto7.jpeg','foto17.jpeg'] },
 { etiket: 'Dünyanın', vurgu: 'Komik', ek: 'i', fotolar: ['foto8.jpeg','foto9.jpeg','foto10.jpeg'] },
 { etiket: 'Dünyanın', vurgu: 'Samimi', ek: 'si', fotolar: ['foto11.jpeg','foto12.jpeg','foto13.jpeg','foto18.jpeg'] },
 { etiket: 'Dünyanın', vurgu: 'Güzel', ek: 'i', fotolar: ['foto14.jpeg','foto15.jpeg','foto16.jpeg'] },
 ];

 function mobilMi() {
 return window.innerWidth < 768 || matchMedia('(pointer: coarse)').matches;
 }
 let MOBIL = mobilMi();
 const MOBIL_OTO_ILERLE = false;

 // ★ FIX 3: Mobil sürükle hassasiyeti biraz artırıldı (daha doğal hissettirmek için)
 function surukleHassasiyet() { return MOBIL ? 0.007 : 0.0042; }
 let dokunmaBasX = 0;

 function mobilModuUygula() {
 MOBIL = mobilMi();
 document.body.classList.toggle('mobil-mod', MOBIL);
 guncelleIpucu();
 guncelleMobilAdim();
 }

 const FOTO_YER = [
 { ox: -34, oy: -6, rot: -8, derinlik: 0.4 },
 { ox: 0, oy: 0, rot: 0, derinlik: 0.7 },
 { ox: 34, oy: 6, rot: 8, derinlik: 0.4 },
 { ox: -20, oy: 10, rot: -5, derinlik: 0.35 },
 ];

 const slaytlar = ['s1','s2','s3','s4'];
 const sureler = [3000, 3000, 3000, 3000];
 let mevcut = 0;

 function slaytGoster(index) {
 slaytlar.forEach((id, i) => {
 document.getElementById(id).classList.remove('aktif');
 document.getElementById('n' + (i + 1)).classList.remove('aktif');
 });
 if (index >= slaytlar.length) {
 const ekran = document.getElementById('slayt-ekrani');
 ekran.classList.add('kapat');
 setTimeout(() => { ekran.style.display = 'none'; yolculukBaslat(); }, 1200);
 return;
 }
 document.getElementById(slaytlar[index]).classList.add('aktif');
 document.getElementById('n' + (index + 1)).classList.add('aktif');
 setTimeout(() => { mevcut++; slaytGoster(mevcut); }, sureler[index]);
 }

 let ilerleme = 0, hedefIlerleme = 0, yolAktif = false, yolRaf = null;
 let surukleniyor = false, sonSurukleX = 0, sonBolumIdx = 0, otoTimer = null;
 let fareX = 0, fareY = 0, hedefFareX = 0, hedefFareY = 0;
 const zamanBas = Date.now();

 const yolEkran = document.getElementById('yolculuk-ekrani');
 const yolIz = document.getElementById('yolculuk-iz');
 const mbEtiket = document.getElementById('mb-etiket');
 const mbBaslik = document.getElementById('mb-baslik');
 const merkezBaslik = document.getElementById('merkez-baslik');
 const ipucuEl = document.getElementById('yolculuk-ipucu');
 const ilerlemeEl = document.getElementById('yolculuk-ilerleme');
 const barDolgu = document.getElementById('yolculuk-bar-dolgu');
 const btnGeri = document.getElementById('yol-geri');
 const btnIleri = document.getElementById('yol-ileri');
 const mbtnGeri = document.getElementById('yol-mbtn-geri');
 const mbtnIleri = document.getElementById('yol-mbtn-ileri');
 const mbtnAdim = document.getElementById('yol-mbtn-adim');

 function guncelleIpucu() {
 ipucuEl.textContent = MOBIL
 ? 'Sola kaydır veya alttaki İleri\'ye bas'
 : 'Sola sürükle — fareyi oynat';
 }
 function guncelleMobilAdim() {
 if (!mbtnAdim) return;
 const idx = Math.min(Math.round(hedefIlerleme), BOLUMLER.length - 1);
 mbtnAdim.textContent = (idx + 1) + ' / ' + BOLUMLER.length;
 if (mbtnGeri) mbtnGeri.disabled = hedefIlerleme <= 0;
 if (mbtnIleri) mbtnIleri.disabled = hedefIlerleme >= BOLUMLER.length;
 }
 mobilModuUygula();
 window.addEventListener('resize', mobilModuUygula);

 document.getElementById('slayt-atla').addEventListener('click', () => {
 mevcut = slaytlar.length;
 slaytGoster(mevcut);
 });
 document.getElementById('slayt-ekrani').addEventListener('click', e => {
 if (!mobilMi()) return;
 if (e.target.closest('#slayt-atla')) return;
 mevcut = slaytlar.length;
 slaytGoster(mevcut);
 });

 function yolculukBaslat() {
 MOBIL = mobilMi();
 document.body.classList.toggle('mobil-mod', MOBIL);
 yolIz.innerHTML = '';
 ilerlemeEl.innerHTML = '';
 BOLUMLER.forEach((_, i) => {
 const n = document.createElement('div');
 n.className = 'yol-nokta' + (i === 0 ? ' aktif' : '');
 n.id = 'yn' + i;
 ilerlemeEl.appendChild(n);
 });

 // ★ FIX 1 (JS): Mobilde de tüm fotoğrafları yükle — artık mobilFoto kısıtlaması yok
 BOLUMLER.forEach((bolum, bi) => {
 bolum.fotolar.forEach((dosya, fi) => {
 const yer = FOTO_YER[fi % FOTO_YER.length];
 const el = document.createElement('div');
 const isHero = (fi === 1 || bolum.fotolar.length === 1);
 el.className = 'yol-foto' + (isHero ? ' yol-foto--hero' : ' yol-foto--yan');
 el.dataset.bolum = bi;
 el.dataset.ox = yer.ox;
 el.dataset.oy = yer.oy;
 el.dataset.rot = yer.rot;
 el.dataset.parallax = yer.derinlik;
 const img = document.createElement('img');
 img.src = dosya;
 img.alt = 'Rüviş';
 img.loading = 'eager';
 img.draggable = false;
 img.onerror = () => { el.innerHTML = '<div class="yol-foto__ph"><span>📷</span>' + dosya + '</div>'; };
 el.appendChild(img);
 yolIz.appendChild(el);
 });
 });

 merkezBaslikGuncelle(0);
 yolEkran.classList.add('aktif');
 yolAktif = true;
 yolAnimasyon();
 if (MOBIL && MOBIL_OTO_ILERLE) mobilOtoBaslat();
 }

 function merkezBaslikGuncelle(idx) {
 const b = BOLUMLER[Math.min(idx, BOLUMLER.length - 1)];
 if (!b) return;
 merkezBaslik.classList.add('soluk');
 setTimeout(() => {
 mbEtiket.textContent = b.etiket;
 mbBaslik.innerHTML = 'En <span>' + b.vurgu + '</span>' + b.ek;
 merkezBaslik.classList.remove('soluk');
 }, 120);
 BOLUMLER.forEach((_, i) => {
 const n = document.getElementById('yn' + i);
 if (n) n.classList.toggle('aktif', i === idx);
 });
 }

 // ★ FIX 2 (JS): Mobilde de aynı 3D layout — ayrı mobil kolu kaldırıldı
 function yolFotoKonumlari(p) {
 const vw = window.innerWidth, vh = window.innerHeight;
 const surukleAktif = surukleniyor || Math.abs(hedefIlerleme - ilerleme) > 0.02;
 merkezBaslik.classList.toggle('soluk', surukleAktif);

 const t = (Date.now() - zamanBas) * 0.001;
 // Mobilde fare parallax sıfır (dokunmatik ekranda yok)
 const fx = MOBIL ? 0 : fareX;
 const fy = MOBIL ? 0 : fareY;

 document.querySelectorAll('.yol-foto').forEach((el, i) => {
 const bi = parseInt(el.dataset.bolum, 10);
 const ox = parseFloat(el.dataset.ox), oy = parseFloat(el.dataset.oy);
 const rot0 = parseFloat(el.dataset.rot);
 const pDerin = parseFloat(el.dataset.parallax) || 0.5;
 const lokal = p - bi;
 const isHero = el.classList.contains('yol-foto--hero');

 const kaydirX = lokal * -vw * 0.88;
 const xPx = (ox / 100) * vw + kaydirX + fx * pDerin * 38 + Math.sin(t + i * 0.7) * 3;
 const yPx = (oy / 100) * vh + fy * pDerin * 28 + Math.cos(t * 0.8 + i) * 2;

 const merkezUzak = Math.abs(lokal);
 const derinlik = Math.max(0, 1 - merkezUzak * 0.42);
 let scale = isHero ? 0.78 + derinlik * 0.32 : 0.62 + derinlik * 0.38;
 if (merkezUzak < 0.28) scale = Math.max(scale, isHero ? 1.02 : 0.88);

 const opak = lokal < -0.75 ? 0 : lokal > 1.55 ? 0 : Math.min(1, derinlik * 0.9 + 0.35);
 const rotY = lokal * -20 + fx * 3;
 const z = Math.round((1 - merkezUzak) * 300) + (isHero ? 80 : 0);

 el.classList.toggle('onde', merkezUzak < 0.4);
 el.style.opacity = opak;
 el.style.zIndex = z;
 el.style.transform =
 'translate3d(' + xPx + 'px,' + yPx + 'px,' + (-merkezUzak * 120) + 'px) ' +
 'scale(' + scale + ') rotateY(' + rotY + 'deg) rotate(' + (rot0 + fy * 2) + 'deg)';
 });
 }

 function yolAnimasyon() {
 if (!yolAktif) return;
 fareX += (hedefFareX - fareX) * 0.06;
 fareY += (hedefFareY - fareY) * 0.06;
 ilerleme += (hedefIlerleme - ilerleme) * 0.09;
 const idx = Math.round(ilerleme);
 if (idx !== sonBolumIdx && idx < BOLUMLER.length) { sonBolumIdx = idx; merkezBaslikGuncelle(idx); }
 yolFotoKonumlari(ilerleme);
 guncelleMobilAdim();
 if (barDolgu) barDolgu.style.width = (Math.min(ilerleme, BOLUMLER.length) / BOLUMLER.length * 100) + '%';
 if (ilerleme >= BOLUMLER.length - 0.05 && hedefIlerleme >= BOLUMLER.length - 0.05) { yolculukBitir(); return; }
 yolRaf = requestAnimationFrame(yolAnimasyon);
 }

 // ★ FIX 3 (JS): Ortak sürükle fonksiyonları — mobil ve masaüstü aynı delta mantığı
 function surukleBasla(x) {
 surukleniyor = true;
 sonSurukleX = x;
 dokunmaBasX = x;
 yolEkran.classList.add('surukleniyor');
 mobilOtoDurdur();
 }

 function surukleHareket(x) {
 if (!surukleniyor) return;
 const dx = x - sonSurukleX;
 sonSurukleX = x;
 // Fotoğraflar parmakla birlikte kayar — canlı efekt
 hedefIlerleme = Math.max(0, Math.min(BOLUMLER.length, hedefIlerleme - dx * surukleHassasiyet()));
 }

 function surukleBitir(sonX) {
 if (!surukleniyor) return;
 surukleniyor = false;
 yolEkran.classList.remove('surukleniyor');
 // Parmak bırakıldığında toplam kaydırma mesafesine göre bölüm değiştir
 const toplamDx = (sonX !== undefined ? sonX : sonSurukleX) - dokunmaBasX;
 if (Math.abs(toplamDx) > window.innerWidth * 0.12) {
 hedefIlerleme = Math.max(0, Math.min(BOLUMLER.length, Math.round(hedefIlerleme)));
 } else {
 hedefIlerleme = Math.max(0, Math.min(BOLUMLER.length, Math.round(ilerleme)));
 }
 if (MOBIL && MOBIL_OTO_ILERLE) mobilOtoBaslat();
 }

 function bolumAtla(yon) {
 mobilOtoDurdur();
 const yeni = Math.round(hedefIlerleme) + yon;
 hedefIlerleme = Math.max(0, Math.min(BOLUMLER.length, yeni));
 guncelleMobilAdim();
 }

 // Mouse olayları
 yolEkran.addEventListener('mousedown', e => { e.preventDefault(); surukleBasla(e.clientX); });
 window.addEventListener('mousemove', e => surukleHareket(e.clientX));
 window.addEventListener('mouseup', e => surukleBitir(e.clientX));

 // Touch olayları — mobil ve tablet için canlı sürükle efekti
 yolEkran.addEventListener('touchstart', e => {
 if (!e.touches[0]) return;
 surukleBasla(e.touches[0].clientX);
 }, { passive: true });

 yolEkran.addEventListener('touchmove', e => {
 if (!e.touches[0]) return;
 surukleHareket(e.touches[0].clientX);
 e.preventDefault();
 }, { passive: false });

 yolEkran.addEventListener('touchend', e => {
 if (!e.changedTouches[0]) return;
 surukleBitir(e.changedTouches[0].clientX);
 });

 yolEkran.addEventListener('touchcancel', () => surukleBitir());

 // Fare parallax (sadece masaüstü)
 function fareParallax(clientX, clientY) {
 if (MOBIL) return;
 hedefFareX = (clientX / window.innerWidth - 0.5) * 2;
 hedefFareY = (clientY / window.innerHeight - 0.5) * 2;
 }
 yolEkran.addEventListener('mousemove', e => fareParallax(e.clientX, e.clientY));

 if (btnGeri) btnGeri.addEventListener('click', e => { e.stopPropagation(); bolumAtla(-1); });
 if (btnIleri) btnIleri.addEventListener('click', e => { e.stopPropagation(); bolumAtla(1); });
 if (mbtnGeri) mbtnGeri.addEventListener('click', e => { e.stopPropagation(); bolumAtla(-1); });
 if (mbtnIleri) mbtnIleri.addEventListener('click', e => { e.stopPropagation(); bolumAtla(1); });

 function mobilOtoBaslat() {
 mobilOtoDurdur();
 if (!MOBIL_OTO_ILERLE || !yolAktif) return;
 otoTimer = setInterval(() => {
 if (surukleniyor) return;
 const hedef = Math.min(BOLUMLER.length, Math.floor(hedefIlerleme) + 1);
 if (hedefIlerleme < hedef) hedefIlerleme += 0.012;
 else if (hedef >= BOLUMLER.length) mobilOtoDurdur();
 }, 40);
 }

 function mobilOtoDurdur() { if (otoTimer) { clearInterval(otoTimer); otoTimer = null; } }

 function yolculukBitir() {
 if (!yolAktif) return;
 yolAktif = false;
 mobilOtoDurdur();
 if (yolRaf) cancelAnimationFrame(yolRaf);
 document.getElementById('yolculuk-finale').classList.add('gorunur');
 setTimeout(cicekleriBaslat, 3200);
 }

 function cicekleriBaslat() {
 yolEkran.style.transition = 'opacity 1s ease';
 yolEkran.style.opacity = '0';
 yolEkran.style.pointerEvents = 'none';
 setTimeout(() => {
 yolEkran.style.display = 'none';
 document.body.classList.remove('not-loaded');
 setTimeout(() => document.getElementById('ust-banner').classList.add('gorunu'), 1000);
 }, 1000);
 }

 setTimeout(() => slaytGoster(0), 400);
 </script>
